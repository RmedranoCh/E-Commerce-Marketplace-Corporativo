version: '3.8'

networks:
  public-gateway:
    driver: bridge
  backend-mesh:
    driver: bridge
  data-isolated:
    driver: bridge
    internal: true

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASS: ${APP_DB_PASS}
      APP_DB_NAME: ${APP_DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - data-isolated
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    networks:
      - data-isolated
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "15672:15672"
    networks:
      - data-isolated
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 8s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      - SECRET_KEY=${AUTH_SECRET_KEY}
      - DATABASE_URL=sqlite:////app/db_data/auth.db
    volumes:
      - auth_data:/app/db_data
    networks:
      - backend-mesh
      - data-isolated

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    command: sh -c "mkdir -p /app/media/products && python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:8000 --workers 4 --threads 2 core.wsgi:application"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - JWT_SECRET_KEY=${AUTH_SECRET_KEY}
      - DJANGO_DEBUG=False
      - DB_NAME=${APP_DB_NAME}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASS}
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - JWT_PUBLIC_KEY_FILE=/app/db_data/public_key.pem
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,order-service,web-frontend,gateway
    volumes:
      - media_compartido:/app/media
      - auth_data:/app/db_data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      backend-mesh:
        aliases:
          - order-service
          - order_service
      data-isolated:

  outbox-worker:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: outbox_worker
    command: python orders/publisher.py
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - DB_NAME=${APP_DB_NAME}
      - DB_USER=${APP_DB_USER}
      - DB_PASSWORD=${APP_DB_PASS}
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - data-isolated

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification_service
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend-mesh
      - data-isolated

  web-frontend:
    build:
      context: ./web-frontend
      dockerfile: Dockerfile
    container_name: web_frontend
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5000
      - ORDER_SERVICE_URL=http://order-service:8000
      - SECRET_KEY=${AUTH_SECRET_KEY}
      - FRONTEND_SECRET_KEY=${FRONTEND_SECRET_KEY}
      - JWT_PUBLIC_KEY_FILE=/app/db_data/public_key.pem
    volumes:
      - media_compartido:/app/media
      - auth_data:/app/db_data:ro
    depends_on:
      - auth-service
      - order-service
    networks:
      - public-gateway
      - backend-mesh

  gateway:
    image: nginx:alpine
    container_name: nginx_gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_compartido:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web-frontend
      - auth-service
      - order-service
    networks:
      - public-gateway
      - backend-mesh

volumes:
  pgdata:
  auth_data:
  media_compartido:
